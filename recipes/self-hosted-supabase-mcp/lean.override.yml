services:
  studio:
    profiles: [ui]
  api-gw:
    depends_on: !reset {}
  meta:
    profiles: [ui]
  storage:
    environment:
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - ob1-storage:/var/lib/storage
    depends_on: !override
      db:
        condition: service_healthy
      rest:
        condition: service_started
  imgproxy:
    profiles: [images]
  auth:
    profiles: [never]
  realtime:
    profiles: [never]
  supavisor:
    profiles: [never]
  functions:
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CHAT_API_BASE: ${CHAT_API_BASE}
      CHAT_API_KEY: ${CHAT_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS}
    volumes:
      - ../../../../integrations/self-hosted-llm-mcp:/home/deno/functions/self-hosted-llm-mcp:ro
  ob1-init:
    image: busybox:1.37

volumes:
  ob1-storage:
