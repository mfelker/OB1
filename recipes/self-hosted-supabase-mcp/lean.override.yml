services:
  studio:
    profiles: [ui]
  api-gw:
    depends_on: !reset {}
  meta:
    profiles: [ui]
  storage:
    environment:
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - ob1-storage:/var/lib/storage
    depends_on: !override
      db:
        condition: service_healthy
      rest:
        condition: service_started
  imgproxy:
    profiles: [images]
  auth:
    profiles: [never]
  realtime:
    profiles: [never]
  supavisor:
    profiles: [never]
  ob1-init:
    image: busybox:1.37

volumes:
  ob1-storage:
